# Fine-grained OpenClash / Mihomo 配置（双机场 + 图标 + 国内直连修复）
#
# 本文件是新建文件，不替换 youtube.ini / yaml.ini。
#
# 修复点：
# 1. 国内 GEOSITE,cn / GEOIP,cn 放到 MATCH 之前，避免国内站掉进漏网之鱼走海外节点
# 2. 删除无效 GEOIP（adobe/Notion/github/tiktok/teamviewer/microsoft）
# 3. GEOSITE 分类名一律小写；含 ! @ 的规则加引号
# 4. 两个 proxy-providers 分别显示在 YACD Providers
# 5. 每个策略组带 icon，YACD / metacubexd 可显示图标
# 6. 应用组只引用地区/机场组，不再把全部节点 dump 进每个 App
#
# OpenClash：配置管理 → 上传本文件 → 切换启用。
#   请关闭该配置的「在线订阅转换」，否则会把 proxy-providers 冲掉。
#   DNS / TUN / 端口由 LuCI 覆写接管，本文件不写。
#   插件设置 → GEO 规则更新：必须先更新 GeoSite / GeoIP。
# Clash Verge：导入后在客户端开启 DNS（Fake-IP）并更新 GeoX。
#   TUN 必须打开「自动识别出口网卡 / auto-detect-interface」。
#
proxy-providers:
  Todust:
    type: http
    url: "https://a2fc8buv0t.qinyues4.cc/2e8d88ec974f9f44930ee26edab7cf8d"
    interval: 3600
    proxy: DIRECT
    path: ./proxy_provider/Todust.yaml
    header:
      User-Agent:
      - clash-verge/v2.4.5
    exclude-filter: (?i)(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
    override:
      additional-prefix: 'Todust | '
      skip-cert-verify: true
      udp: true
  Mitce:
    type: http
    url: "https://app.mitce.net/?sid=417226&token=e5c112a5cb340ddbe0e4"
    interval: 3600
    proxy: DIRECT
    path: ./proxy_provider/Mitce.yaml
    header:
      User-Agent:
      - clash-verge/v2.4.5
    exclude-filter: (?i)(流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website)
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
    override:
      additional-prefix: 'Mitce | '
      skip-cert-verify: true
      udp: true
